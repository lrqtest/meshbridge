<div class="view" id="view-landing" hidden>
  <header class="site-nav" id="site-nav">

      <nav class="nav-links" aria-label="Sections">

      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero wrap">
      <p class="eyebrow reveal"><span class="pulse"></span><span data-i18n="hero.eyebrow"></span></p>
      <h1 class="display hero-title reveal"><span data-i18n="hero.title"></span> <em data-i18n="hero.titleEm"></em></h1>
      <p class="lede reveal" data-i18n="hero.lede"></p>
      <div class="cta-row reveal">
        <a class="btn btn-primary btn-lg" href="#/register" data-cta="register"><span data-i18n="hero.ctaPrimary"></span><svg class="icon arrow"><use href="#i-arrow"/></svg></a>
        <a class="btn btn-outline btn-lg" href="#/login" data-i18n="hero.ctaSecondary"></a>
      </div>
      <p class="fine reveal" data-i18n="hero.fine"></p>
    </section>

    <section class="wrap map-wrap reveal">
      <figure class="terrain" id="hero-map" role="img" data-i18n-attr="aria-label:map.aria">
        <svg class="terrain-svg" data-terrain="hero" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="map-labels" aria-hidden="true">
          <div class="map-label" data-node="nas"><b data-i18n="map.nas"></b><span>100.64.0.2</span></div>
          <div class="map-label" data-node="laptop"><b data-i18n="map.laptop"></b><span>100.64.0.5</span></div>
          <div class="map-label" data-node="studio"><b data-i18n="map.studio"></b><span>100.64.0.9</span></div>
          <div class="map-label ctrl" data-node="control"><b data-i18n="map.control"></b><span data-i18n="map.controlNote"></span></div>
        </div>
        <figcaption class="map-legend">
          <span><i></i><span data-i18n="map.legendDirect"></span></span>
          <span><i class="sig"></i><span data-i18n="map.legendSignal"></span></span>
        </figcaption>
      </figure>
    </section>

    <section class="wrap">
      <div class="facts">
        <div class="fact reveal"><div class="fact-v display">P2P</div><div class="fact-l" data-i18n="facts.p2pLabel"></div></div>
        <div class="fact reveal"><div class="fact-v display">64 MiB</div><div class="fact-l" data-i18n="facts.chunkLabel"></div></div>
        <div class="fact reveal"><div class="fact-v display">BLAKE3</div><div class="fact-l" data-i18n="facts.hashLabel"></div></div>
        <div class="fact reveal"><div class="fact-v display">≈ 0</div><div class="fact-l" data-i18n="facts.zeroLabel"></div></div>
      </div>
    </section>

    <section class="section wrap" id="what">
      <div class="sec-head">
        <div class="reveal"><p class="kicker" data-i18n="what.kicker"></p><h2 class="display sec-title" data-i18n="what.title"></h2></div>
        <p class="sec-body reveal" data-i18n="what.body"></p>
      </div>
      <div class="cards">
        <article class="card reveal">
          <div class="card-ic"><svg class="icon"><use href="#i-mesh"/></svg></div>
          <h3 class="display card-title" data-i18n="what.c1Title"></h3>
          <p class="card-body" data-i18n="what.c1Body"></p>
          <p class="card-tag" data-i18n="what.c1Tag"></p>
        </article>
        <article class="card reveal">
          <div class="card-ic clay"><svg class="icon"><use href="#i-box"/></svg></div>
          <h3 class="display card-title" data-i18n="what.c2Title"></h3>
          <p class="card-body" data-i18n="what.c2Body"></p>
          <p class="card-tag" data-i18n="what.c2Tag"></p>
        </article>
        <article class="card reveal">
          <div class="card-ic slate"><svg class="icon"><use href="#i-route"/></svg></div>
          <h3 class="display card-title" data-i18n="what.c3Title"></h3>
          <p class="card-body" data-i18n="what.c3Body"></p>
          <p class="card-tag" data-i18n="what.c3Tag"></p>
        </article>
      </div>
    </section>

    <div class="band" id="principle">
      <section class="section wrap">
        <div class="sec-head">
          <div class="reveal"><p class="kicker" data-i18n="principle.kicker"></p><h2 class="display sec-title" data-i18n="principle.title"></h2></div>
          <p class="sec-body reveal" data-i18n="principle.body"></p>
        </div>
        <ol class="ladder reveal">
          <li class="rung r1">
            <div class="rung-from"><span class="rung-n">1</span><div><div class="rung-name" data-i18n="principle.r1Name"></div><div class="rung-note" data-i18n="principle.r1Note"></div></div></div>
            <div class="rung-line"><span class="rung-flow" data-i18n="principle.r1Flow"></span><i class="packet"></i></div>
            <div class="rung-to"><div class="rung-name" data-i18n="principle.dest"></div><div class="rung-note" data-i18n="principle.r1DestNote"></div></div>
          </li>
          <li class="rung r2">
            <div class="rung-from"><span class="rung-n">2</span><div><div class="rung-name" data-i18n="principle.r2Name"></div><div class="rung-note" data-i18n="principle.r2Note"></div></div></div>
            <div class="rung-line"><i class="packet"></i></div>
            <div class="rung-to"><div class="rung-name" data-i18n="principle.dest"></div><div class="rung-note" data-i18n="principle.r2DestNote"></div></div>
          </li>
          <li class="rung r3">
            <div class="rung-from"><span class="rung-n">3</span><div><div class="rung-name" data-i18n="principle.r3Name"></div><div class="rung-note" data-i18n="principle.r3Note"></div></div></div>
            <div class="rung-line"><i class="packet"></i></div>
            <div class="rung-to"><div class="rung-name" data-i18n="principle.dest"></div><div class="rung-note" data-i18n="principle.r3DestNote"></div></div>
          </li>
          <li class="rung refused">
            <div class="rung-from"><span class="rung-n">✕</span><div><div class="rung-name" data-i18n="principle.r4Name"></div><div class="rung-note" data-i18n="principle.r4Note"></div></div></div>
            <div class="rung-line"><i class="packet"></i><span class="x-mark"><svg class="icon"><use href="#i-x"/></svg></span></div>
            <div class="rung-to"><div class="rung-name" data-i18n="principle.r4Dest"></div><div class="rung-note" data-i18n="principle.r4DestNote"></div></div>
          </li>
        </ol>
      </section>
    </div>

    <section class="section wrap" id="how">
      <div class="sec-head">
        <div class="reveal"><p class="kicker" data-i18n="how.kicker"></p><h2 class="display sec-title" data-i18n="how.title"></h2></div>
        <p class="sec-body reveal" data-i18n="how.body"></p>
      </div>
      <div class="steps">
        <div class="step reveal"><div class="step-n">01</div><h3 class="display step-title" data-i18n="how.s1Title"></h3><p class="step-body" data-i18n="how.s1Body"></p></div>
        <div class="step reveal"><div class="step-n">02</div><h3 class="display step-title" data-i18n="how.s2Title"></h3><p class="step-body" data-i18n="how.s2Body"></p></div>
        <div class="step reveal"><div class="step-n">03</div><h3 class="display step-title" data-i18n="how.s3Title"></h3><p class="step-body" data-i18n="how.s3Body"></p></div>
      </div>
    </section>

    <section class="wrap closing">
      <div class="closing-card reveal">
        <svg class="terrain-svg" data-terrain="closing" preserveAspectRatio="none" aria-hidden="true"></svg>
        <h2 class="display closing-title" data-i18n="closing.title"></h2>
        <p class="closing-body" data-i18n="closing.body"></p>
        <a class="btn btn-lg" href="#/register" data-cta="register"><span data-i18n="closing.cta"></span><svg class="icon arrow"><use href="#i-arrow"/></svg></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="foot-in">
        <a class="brand" href="#/"><svg class="mark"><use href="#i-mark"/></svg><span class="wordmark">MeshBridge</span></a>
        <span class="foot-tag" data-i18n="footer.tagline"></span>
        <div class="foot-tools">
          <div class="lang-picker" data-lang-picker data-up></div>
          <button class="icon-btn theme-toggle" type="button" data-theme-toggle data-i18n-attr="aria-label:common.toggleTheme;title:common.toggleTheme"><svg class="icon i-sun"><use href="#i-sun"/></svg><svg class="icon i-moon"><use href="#i-moon"/></svg></button>
        </div>
      </div>
      <div class="foot-bottom"><span>© <span data-year></span> MeshBridge</span><span data-i18n="footer.stack"></span></div>

<!-- ═════════════════════════ AUTH + SETUP ═════════════════════════ -->
<div class="view auth-view" id="view-auth" hidden>
  <div class="auth-side">
    <header class="auth-top">
      <a class="brand" href="#/"><svg class="mark"><use href="#i-mark"/></svg><span class="wordmark">MeshBridge</span></a>
      <div class="auth-tools">
        <div class="lang-picker" data-lang-picker></div>
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle data-i18n-attr="aria-label:common.toggleTheme;title:common.toggleTheme"><svg class="icon i-sun"><use href="#i-sun"/></svg><svg class="icon i-moon"><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <main class="auth-main" id="main-auth">
      <!-- login -->
      <section class="auth-card" data-panel="login" hidden>
        <h1 class="display auth-title" data-i18n="auth.login.title"></h1>
        <p class="auth-sub" data-i18n="auth.login.sub"></p>
        <div class="callout" data-role="notice" hidden><svg class="icon"><use href="#i-info"/></svg><div data-role="notice-text"></div></div>
        <form id="form-login" novalidate>
          <label class="field"><span class="label" data-i18n="auth.emailOrUser"></span>
            <input class="input" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required data-i18n-attr="placeholder:auth.emailPh"></label>
          <label class="field"><span class="label"><span data-i18n="auth.password"></span><a class="link" href="#/forgot" data-i18n="auth.login.forgot"></a></span>
            <span class="pw"><input class="input" name="password" type="password" autocomplete="current-password" required><button type="button" class="pw-toggle" data-pw-toggle aria-pressed="false" data-i18n-attr="aria-label:common.showPassword"><svg class="icon i-eye"><use href="#i-eye"/></svg><svg class="icon i-eye-off"><use href="#i-eye-off"/></svg></button></span></label>
          <div class="callout error" data-role="err" hidden><svg class="icon"><use href="#i-alert"/></svg><div data-role="err-text"></div></div>
          <div class="form-actions"><button class="btn btn-primary btn-lg btn-block" type="submit" data-i18n="auth.login.submit"></button></div>
        </form>
        <p class="auth-alt" data-reg-link><span data-i18n="auth.login.noAccount"></span> <a class="link" href="#/register" data-i18n="auth.login.create"></a></p>
      </section>

      <!-- register -->
      <section class="auth-card" data-panel="register" hidden>
        <h1 class="display auth-title" data-i18n="auth.register.title"></h1>
        <p class="auth-sub" data-i18n="auth.register.sub"></p>
        <div class="callout warn" data-role="closed" hidden><svg class="icon"><use href="#i-lock"/></svg><div data-i18n="auth.register.closed"></div></div>
        <form id="form-register" novalidate>
          <label class="field"><span class="label" data-i18n="auth.email"></span>
            <span class="row"><input class="input grow" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required data-i18n-attr="placeholder:auth.emailPh"><button class="btn btn-outline" type="button" data-send-code="register" data-i18n="auth.sendCode"></button></span></label>
          <label class="field"><span class="label" data-i18n="auth.code"></span>
            <input class="input code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required data-i18n-attr="placeholder:auth.codePh"></label>
          <label class="field"><span class="label"><span data-i18n="auth.username"></span><span class="opt" data-i18n="common.optional"></span></span>

<!-- ═════════════════════════ TEMPLATES ═════════════════════════ -->
<template id="tpl-enroll">
  <form class="enroll-form" novalidate>
    <label class="field"><span class="label" data-i18n="enroll.host"></span>
      <span class="row"><input class="input grow mono" name="host" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="63" data-i18n-attr="placeholder:enroll.hostPh"><button class="btn btn-primary" type="submit" data-i18n="enroll.generate"></button></span>
      <span class="hint" data-i18n="enroll.hostHint"></span></label>
    <div class="callout error" data-role="err" hidden><svg class="icon"><use href="#i-alert"/></svg><div data-role="err-text"></div></div>
  </form>
  <div class="enroll-out" data-role="out" hidden>
    <div class="enroll-head">
      <span class="pill ok"><span class="dot"></span><span data-role="reg"></span></span>
      <span class="tag-mono" data-role="id"></span>
    </div>
    <div class="callout warn"><svg class="icon"><use href="#i-key"/></svg><div data-i18n="enroll.onceWarn"></div></div>
    <div class="callout warn" data-role="hs" hidden><svg class="icon"><use href="#i-alert"/></svg><div data-role="hs-text"></div></div>
    <div class="kv-block" data-role="preauth-block">
      <span class="label" data-i18n="enroll.preauth"></span>
      <div class="secret-row"><span class="mono" data-role="preauth"></span><button class="copy-btn" type="button" data-copy="preauth"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="common.copy"></span></button></div>
    </div>
    <div class="kv-block">
      <span class="label" data-i18n="enroll.token"></span>
      <div class="secret-row"><span class="mono hot" data-role="token"></span><button class="copy-btn" type="button" data-copy="token"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="common.copy"></span></button></div>
    </div>
    <div class="os-tabs">
      <span class="label" data-i18n="enroll.run"></span>
      <div class="segmented" data-role="os" role="group">
        <button type="button" data-os="linux" aria-pressed="true">Linux</button>
        <button type="button" data-os="macos" aria-pressed="false">macOS</button>
        <button type="button" data-os="windows" aria-pressed="false">Windows</button>
      </div>
    </div>
    <div class="kv-block code-wrap"><pre class="code" data-role="cmd"></pre></div>
  </div>
</template>

<template id="tpl-smtp">
  <form class="smtp-form" novalidate>
    <div class="field"><span class="label" data-i18n="smtp.presets"></span><div class="chips" data-role="presets"></div></div>
    <div class="grid-2">
      <label class="field"><span class="label" data-i18n="smtp.host"></span>
        <input class="input" name="host" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="smtp.example.com"></label>
      <label class="field"><span class="label" data-i18n="smtp.port"></span>
        <span class="select-wrap"><select class="select" name="port"><option value="465"></option><option value="587"></option><option value="25"></option></select><svg class="icon chev"><use href="#i-chevron"/></svg></span></label>
    </div>
    <div class="grid-2">
      <label class="field"><span class="label" data-i18n="smtp.user"></span>
        <input class="input" name="username" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="you@example.com"></label>
      <label class="field"><span class="label" data-i18n="smtp.pass"></span>
        <span class="pw"><input class="input" name="password" type="password" autocomplete="new-password"><button type="button" class="pw-toggle" data-pw-toggle aria-pressed="false" data-i18n-attr="aria-label:common.showPassword"><svg class="icon i-eye"><use href="#i-eye"/></svg><svg class="icon i-eye-off"><use href="#i-eye-off"/></svg></button></span></label>
    </div>
    <label class="field"><span class="label"><span data-i18n="smtp.from"></span><span class="opt" data-i18n="common.optional"></span></span>
      <input class="input" name="from" autocomplete="off" autocapitalize="none" spellcheck="false" data-i18n-attr="placeholder:smtp.fromPh"></label>
    <p class="hint" data-role="provider-hint" hidden></p>
    <div class="callout error" data-role="err" hidden><svg class="icon"><use href="#i-alert"/></svg><div data-role="err-text"></div></div>
    <div class="form-actions" data-role="actions"></div>
  </form>
</template>
</body>
</html>
